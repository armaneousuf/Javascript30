<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Multiple Checkboxes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Select Multiple Checkboxes</h1>
    <p>Hold <strong>Shift</strong> and click to select a range of checkboxes.</p>
    <div class="container">
        <div class="checkbox-group" id="checkboxes">
            <!-- Checkboxes will be generated by JavaScript -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
