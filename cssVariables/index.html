<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Css Variable</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Update CSS variables with <span>JavaScript</span></h1>
    <div class="container">
      <label for="spacing">Spacing:</label>
      <input type="range" id="spacing" min="10" max="200" value="10" data-sizing="px">

      <label for="blur">Blur:</label>
      <input type="range" id="blur" min="0" max="25" value="10" data-sizing="px">

      <label for="color">Color</label>
      <input type="color" id="color">
    </div>

    <img src="https://images.unsplash.com/photo-1788204997156-72d623841c2b?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
    <script src="script.js"></script>
  </body>
</html>
